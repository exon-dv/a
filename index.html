<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>History Length Tester</title>
  <style>
    body {
      font-family: monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 16px;
    }
    button {
      background: #16213e;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      padding: 10px 24px;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
      border-radius: 4px;
    }
    button:hover { background: #00d4ff22; }
    #log {
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>history.length tester</h2>

  <button onclick="alert('history.length = ' + history.length)">
    Afficher history.length
  </button>

  <button onclick="history.pushState({}, '', '/page-' + Date.now()); log('pushState')">
    pushState (incrémente)
  </button>

  <button onclick="history.replaceState({}, '', '/page-' + Date.now()); log('replaceState')">
    replaceState (n'incrémente pas)
  </button>

  <div id="log">—</div>

  <script>
    function log(action) {
      document.getElementById('log').textContent =
        action + ' → history.length = ' + history.length;
    };
window.open('https://google.com');
  </script>

</body>
</html>
